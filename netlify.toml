[build]
  # 2026-10-05: the live dashboard frontend (deployed 2026-06-16) was never
  # committed; its exact published files are kept in live-frontend/ and served
  # as-is. src/ is older than that frontend, so it is not built for production.
  command = "npm ci"
  publish = "live-frontend"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # VITE_DEMO_MODE is NOT set here so production deploys default to live mode.
  # For demo/preview deploys, set VITE_DEMO_MODE=true in Netlify UI or a deploy context.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "nft"
  included_files = ["netlify/functions/_shared/**"]

[functions."ingest-scheduled"]
  schedule = "0 */2 * * *"  # every 2h, matching the June 16 live deploy

[functions."stale-scan-scheduled"]
  schedule = "0 8 * * *"
